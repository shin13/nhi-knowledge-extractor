[project]
name = "nhi-extractor"
version = "0.1.1"
description = "Convert Taiwan NHI medication regulation DOCX documents into RAG-ingestion-ready CSVs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-docx>=1.1.2",
    "tiktoken>=0.7.0",
    "curl-cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
nhi-extract = "nhi_extractor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `live` tests hit the real NHI site. Excluded by default so `uv run pytest`
# stays offline and deterministic; run them with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: hits the live NHI website (opt-in; the only check that can catch a Cloudflare block)",
]
